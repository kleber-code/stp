<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojas Belmont - Extrator de Entregas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex items-center gap-4 mb-8 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="p-3 bg-blue-100 text-blue-700 rounded-lg shadow-inner">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">Lojas Belmont</h1>
                <p class="text-sm text-slate-500 font-medium">Extrator de Clientes para Excel</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8">
            <label class="block text-sm font-semibold text-slate-700 mb-3" for="pdf_upload">
                Anexe o arquivo PDF de Entregas/Montagem
            </label>
            <input 
                class="block w-full text-sm text-slate-700 border border-slate-300 rounded-lg cursor-pointer bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-l-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 transition-all" 
                id="pdf_upload" 
                type="file" 
                accept="application/pdf">
            
            <div class="mt-6 flex gap-3">
                <button id="process_btn" class="px-5 py-2.5 bg-slate-900 text-white text-sm font-semibold rounded-lg hover:bg-slate-800 transition-colors hidden shadow-md">
                    Processar Documento
                </button>
                <button id="export_btn" class="px-5 py-2.5 bg-green-600 text-white text-sm font-semibold rounded-lg hover:bg-green-700 transition-colors hidden shadow-md flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Exportar para Excel
                </button>
            </div>
            <p id="status_msg" class="mt-3 text-sm text-slate-500 hidden animate-pulse font-medium italic">Analisando PDF, por favor aguarde...</p>
        </div>

        <div id="results_container" class="bg-white rounded-xl shadow-sm border border-slate-200 hidden overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Cliente</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Pedido</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Data Entrega</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Telefones</th>
                        </tr>
                    </thead>
                    <tbody id="results_body" class="bg-white divide-y divide-slate-100 text-sm">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('pdf_upload');
        const processBtn = document.getElementById('process_btn');
        const exportBtn = document.getElementById('export_btn');
        const statusMsg = document.getElementById('status_msg');
        const resultsContainer = document.getElementById('results_container');
        const resultsBody = document.getElementById('results_body');
        
        let globalExtractedData = [];

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                processBtn.classList.remove('hidden');
                exportBtn.classList.add('hidden');
                resultsContainer.classList.add('hidden');
            }
        });

        processBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            statusMsg.classList.remove('hidden');
            processBtn.disabled = true;
            processBtn.classList.add('opacity-50');
            resultsBody.innerHTML = '';
            exportBtn.classList.add('hidden');

            try {
                const text = await extractTextFromPDF(file);
                globalExtractedData = parseClientsData(text);
                renderTable(globalExtractedData);
                
                if(globalExtractedData.length > 0) {
                    exportBtn.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                statusMsg.textContent = "Erro ao ler o arquivo.";
                statusMsg.classList.add('text-red-500');
            } finally {
                if(!statusMsg.classList.contains('text-red-500')) statusMsg.classList.add('hidden');
                processBtn.disabled = false;
                processBtn.classList.remove('opacity-50');
            }
        });

        exportBtn.addEventListener('click', () => {
            if (globalExtractedData.length === 0) return;
            downloadExcel(globalExtractedData);
        });

        async function extractTextFromPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                fullText += textContent.items.map(item => item.str).join(' ') + ' ';
            }
            return fullText;
        }

        function formatPhoneNumber(raw) {
            const nums = raw.replace(/\D/g, '');
            if (nums.length < 8) return null;
            const d = nums.length > 11 ? nums.slice(-11) : nums;
            if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7,11)}`; 
            if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6,10)}`; 
            if (d.length === 9) return `${d.slice(0,5)}-${d.slice(5,9)}`;
            return `${d.slice(0,4)}-${d.slice(4,8)}`;
        }

        function parseClientsData(text) {
            const blocks = text.split(/CLIENTE:\s*/).slice(1);
            return blocks.map(block => {
                const nameMatch = block.match(/^(.+?)\s*\(/);
                const orderMatch = block.match(/(?:N[º°O]|N)\s*VENDA:\s*([\d\.]+)/i);
                const realDate = block.match(/DATA\s*ENTREGA:\s*(\d{2}\/\d{2}\/\d{2,4})/i);
                const prevDate = block.match(/(?:DATA\s*)?PREVIS[AÃ]O\s*DE\s*ENTREGA:\s*(\d{2}\/\d{2}\/\d{2,4})/i);

                let phones = [];
                const telMatch = block.match(/Tel\.:\s*(.*?)(?=Fone Móvel:|Roteiro:|DADOS DA VENDA|$)/);
                const mobMatch = block.match(/Fone Móvel:\s*(.*?)(?=Roteiro:|DADOS DA VENDA|$)/);
                
                if(telMatch) { const f = formatPhoneNumber(telMatch[1]); if(f) phones.push(f); }
                if(mobMatch) { const f = formatPhoneNumber(mobMatch[1]); if(f) phones.push(f); }

                return {
                    name: nameMatch ? nameMatch[1].trim() : 'Não Identificado',
                    order: orderMatch ? orderMatch[1].trim() : '-',
                    date: realDate ? realDate[1] : (prevDate ? prevDate[1] + ' (Prev.)' : '-'),
                    phones: [...new Set(phones)].length > 0 ? [...new Set(phones)] : ['Sem fone']
                };
            });
        }

        function renderTable(data) {
            resultsContainer.classList.remove('hidden');
            data.forEach(client => {
                const tr = document.createElement('tr');
                const phoneHtml = client.phones.map(p => 
                    `<span class="inline-flex px-2 py-1 rounded bg-blue-50 text-blue-700 border border-blue-100 mr-1 mb-1">${p}</span>`
                ).join('');

                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold text-slate-900">${client.name}</td>
                    <td class="px-6 py-4 text-slate-500">${client.order}</td>
                    <td class="px-6 py-4 font-semibold text-slate-700">${client.date}</td>
                    <td class="px-6 py-4 flex flex-wrap">${phoneHtml}</td>
                `;
                resultsBody.appendChild(tr);
            });
        }

        function downloadExcel(data) {
            // Prepara os dados para o SheetJS
            const worksheetData = data.map(row => ({
                "Cliente": row.name,
                "Nº Pedido": row.order,
                "Data de Entrega": row.date,
                "Telefones": row.phones.join(' / ')
            }));

            // Cria o Workbook e a Worksheet
            const worksheet = XLSX.utils.json_to_sheet(worksheetData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Entregas");

            // Ajusta a largura das colunas automaticamente
            const wscols = [
                {wch: 40}, // Cliente
                {wch: 15}, // Pedido
                {wch: 20}, // Data
                {wch: 30}  // Telefones
            ];
            worksheet['!cols'] = wscols;

            // Gera o download
            const dateStr = new Date().toISOString().split('T')[0];
            XLSX.writeFile(workbook, `belmont_entregas_${dateStr}.xlsx`);
        }
    </script>
</body>
</html>
