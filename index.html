<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartaz Varejo (Folha Amarela) A4 - Atualizado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Fonte Inter para ficar com aspecto de varejo (pesado) */
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap");

      body {
        font-family: "Inter", sans-serif;
        background-color: #e5e7eb;
        margin: 0;
        padding: 0;
      }

      /* Oculta o cartaz fora da impressão */
      #printArea { display: none; }

      /* Modo de pré-visualização (Simulando a folha amarela) */
      .preview-mode {
        display: flex !important;
        width: 210mm;
        height: 297mm;
        background-color: #ffde00;
        margin: 2rem auto;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        overflow: hidden;
        flex-direction: column;
        box-sizing: border-box;
      }

      /* Configurações rigorosas na hora de imprimir de verdade */
      @media print {
        @page {
          size: A4 portrait;
          margin: 0;
        }

        html, body {
          margin: 0 !important;
          padding: 0 !important;
          width: 100%;
          height: 100%;
          background-color: #ffffff !important;
        }

        #controlPanel { display: none !important; }

        /* Torna o fundo transparente na impressora para não gastar tinta amarela */
        #printArea {
          display: flex !important;
          width: 210mm;
          height: 297mm;
          padding: 12mm 15mm !important;
          margin: 0 !important;
          background-color: transparent !important; 
          box-shadow: none !important;
          overflow: hidden;
          flex-direction: column;
          box-sizing: border-box;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }

      /* Utilitários estritos de cores */
      .text-black { color: #111111 !important; }
      .text-red { color: #e60000 !important; } /* Vermelho vivo forte */
    </style>
  </head>
  <body>
    <div id="controlPanel" class="w-full max-w-5xl bg-white shadow-lg overflow-hidden md:mt-8 md:mx-auto rounded-xl border border-gray-200">
      <div class="p-6">
        <h1 class="text-3xl font-extrabold text-black mb-6 border-b pb-4">
          📝 Gerador de Cartaz (Folha Amarela)
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="input-group md:col-span-2">
            <label class="block text-sm font-bold text-gray-700 mb-1">Título Principal</label>
            <input id="inputTitulo" type="text" value="MÃES" class="w-full p-3 border border-gray-400 rounded-lg focus:ring-yellow-500 uppercase" />
          </div>

          <div class="input-group">
            <label class="block text-sm font-bold text-gray-700 mb-1">Cód. Produto</label>
            <input id="inputCodigo" type="text" value="COD. 8343" class="w-full p-3 border border-gray-400 rounded-lg uppercase" />
          </div>

          <div class="input-group">
            <label class="block text-sm font-bold text-gray-700 mb-1">Preço DE (R$)</label>
            <input id="inputDe" type="text" value="4.199,00" class="w-full p-3 border border-gray-400 rounded-lg price-input" />
          </div>

          <div class="input-group md:col-span-4">
            <label class="block text-sm font-bold text-gray-700 mb-1">Nome/Descrição do Produto</label>
            <input id="inputProduto" type="text" value="REFRIGERADOR CRM44MB INVER F. FREE 377L (BRANCO) - CONSUL" class="w-full p-3 border border-gray-400 rounded-lg uppercase" />
          </div>

          <div class="input-group md:col-span-2 bg-gray-50 p-4 rounded-lg border border-gray-200">
            <label class="block text-sm font-bold text-red-600 mb-1">Preço À VISTA (POR R$)</label>
            <input id="inputPor" type="text" value="2.999,99" class="w-full p-3 border border-gray-400 rounded-lg font-bold text-lg price-input text-red-600" />
          </div>

          <div class="input-group md:col-span-2 bg-gray-50 p-4 rounded-lg border border-gray-200">
            <div class="flex gap-2">
              <div class="w-1/3">
                <label class="block text-sm font-bold text-gray-700 mb-1">Condição</label>
                <input id="inputParcTexto" type="text" value="OU 12x" class="w-full p-3 border border-gray-400 rounded-lg uppercase font-bold" />
              </div>
              <div class="w-2/3">
                <label class="block text-sm font-bold text-red-600 mb-1">Valor Parcela</label>
                <input id="inputParcValor" type="text" value="299,99" class="w-full p-3 border border-gray-400 rounded-lg font-bold text-lg price-input text-red-600" />
              </div>
            </div>
          </div>

          <div class="input-group md:col-span-4">
            <label class="block text-sm font-bold text-gray-700 mb-1">Texto Total Parcelado</label>
            <input id="inputTotal" type="text" value="TOTAL R$ 3.479,88" class="w-full p-3 border border-gray-400 rounded-lg uppercase font-bold" />
          </div>
        </div>

        <div class="mt-6">
          <button onclick="window.print()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-black py-4 px-6 rounded-xl shadow border border-yellow-500 text-xl transition-all">
            🖨️ IMPRIMIR CARTAZ
          </button>
        </div>
      </div>
    </div>

    <div id="printArea" class="preview-mode p-10 flex flex-col justify-between">
      
      <div class="w-full flex justify-center items-center overflow-hidden mb-6" style="height: 140px;">
        <h1 id="outTitulo" class="font-black uppercase text-black leading-none whitespace-nowrap tracking-tighter" style="font-size: 140px; letter-spacing: -0.05em;">MÃES</h1>
      </div>

      <div class="w-full text-black font-bold flex flex-col mb-4 px-2">
        <div id="outCodigo" class="text-xl mb-1 opacity-90">COD. 8343</div>
        <div id="outProduto" class="text-2xl leading-tight uppercase w-[90%] mb-2">REFRIGERADOR CRM44MB INVER F. FREE 377L (BRANCO) - CONSUL</div>
        <div id="outDe" class="text-3xl mt-1 font-extrabold tracking-tight">DE R$ 4.199,00</div>
      </div>

      <div class="w-full flex justify-center items-center overflow-hidden flex-1 px-4 my-2">
        <div id="priceBox1" class="flex items-end text-red whitespace-nowrap" style="font-size: 110px;">
          <div class="flex flex-col text-black font-black text-right leading-[0.8] mr-[0.1em] mb-[0.2em]" style="font-size: 0.35em;">
            <span>POR</span>
            <span>R$</span>
          </div>
          <div class="flex items-start font-black">
            <span id="outPorInt" class="leading-[0.75]" style="font-size: 2.2em; letter-spacing: -0.04em;">2.999</span>
            <span id="outPorDec" class="leading-[0.75] mt-[0.08em]" style="font-size: 0.9em; letter-spacing: -0.04em;">,99</span>
          </div>
        </div>
      </div>

      <div class="w-full flex justify-center items-center overflow-hidden flex-1 px-4 mb-4">
        <div id="priceBox2" class="flex items-end text-red whitespace-nowrap pl-[10%]" style="font-size: 85px;">
          <div class="flex flex-col text-black font-black text-right leading-[0.8] mr-[0.15em] mb-[0.15em]" style="font-size: 0.45em;">
            <span id="outParcT1">OU</span>
            <span id="outParcT2">12x</span>
          </div>
          <div class="flex items-start font-black">
            <span id="outParcInt" class="leading-[0.75]" style="font-size: 2.2em; letter-spacing: -0.04em;">299</span>
            <span id="outParcDec" class="leading-[0.75] mt-[0.08em]" style="font-size: 0.9em; letter-spacing: -0.04em;">,99</span>
          </div>
        </div>
      </div>

      <div class="w-full text-center mt-auto pb-4">
        <span id="outTotal" class="text-black font-black text-3xl uppercase tracking-tight">TOTAL R$ 3.479,88</span>
      </div>

    </div>

    <script>
      const elements = {
        inTitulo: document.getElementById("inputTitulo"),
        inCodigo: document.getElementById("inputCodigo"),
        inProduto: document.getElementById("inputProduto"),
        inDe: document.getElementById("inputDe"),
        inPor: document.getElementById("inputPor"),
        inParcTexto: document.getElementById("inputParcTexto"),
        inParcValor: document.getElementById("inputParcValor"),
        inTotal: document.getElementById("inputTotal"),

        outTitulo: document.getElementById("outTitulo"),
        outCodigo: document.getElementById("outCodigo"),
        outProduto: document.getElementById("outProduto"),
        outDe: document.getElementById("outDe"),
        
        outPorInt: document.getElementById("outPorInt"),
        outPorDec: document.getElementById("outPorDec"),
        
        outParcT1: document.getElementById("outParcT1"),
        outParcT2: document.getElementById("outParcT2"),
        outParcInt: document.getElementById("outParcInt"),
        outParcDec: document.getElementById("outParcDec"),
        
        outTotal: document.getElementById("outTotal")
      };

      // MÁSCARA PARA VALORES FINANCEIROS (X.XXX,XX)
      function handlePriceInput(event) {
        let input = event.target;
        let value = input.value.replace(/\D/g, ""); 
        if (!value) {
          input.value = "";
          updateOutput();
          return;
        }
        let numericValue = parseInt(value) / 100;
        input.value = numericValue.toLocaleString("pt-BR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
        updateOutput();
      }

      // Separação em parte Inteira e Centavos (Ex: 2.999 | ,99)
      function splitPrice(priceStr) {
        if (!priceStr) return { int: "0", dec: ",00" };
        const parts = priceStr.split(",");
        const int = parts[0];
        const dec = parts.length > 1 ? "," + parts[1] : ",00";
        return { int, dec };
      }

      // MATEMÁTICA DE AUTO-SCALE (Ajusta fontes grandes se estourarem o A4)
      function fitText(elementId, maxFontSize) {
        const el = document.getElementById(elementId);
        const parent = el.parentElement;
        
        // Retorna a fonte pro máximo pra testar o tamanho real atual
        el.style.fontSize = maxFontSize + 'px';
        
        // Se já cabe na tela, para por aqui (melhora a performance)
        if (el.scrollWidth <= parent.clientWidth) return;
        
        // Calcula a proporção exata de quanto ele deve diminuir e aplica
        const ratio = parent.clientWidth / el.scrollWidth;
        // Dá -2 pixels de margem de segurança pra não bater na borda
        let newSize = Math.floor(maxFontSize * ratio) - 2; 
        
        // Aplica o tamanho novo calculado!
        el.style.fontSize = newSize + 'px';
      }

      function updateOutput() {
        // Textos Básicos
        elements.outTitulo.textContent = elements.inTitulo.value.trim();
        elements.outCodigo.textContent = elements.inCodigo.value.trim();
        elements.outProduto.textContent = elements.inProduto.value.trim();
        
        const valDe = elements.inDe.value.trim();
        elements.outDe.textContent = valDe ? `DE R$ ${valDe}` : "";

        // Preço POR À VISTA
        const pricePor = splitPrice(elements.inPor.value.trim());
        elements.outPorInt.textContent = pricePor.int;
        elements.outPorDec.textContent = pricePor.dec;

        // Texto do Parcelamento
        const parcTexto = elements.inParcTexto.value.trim().split(" ");
        elements.outParcT1.textContent = parcTexto[0] || "";
        elements.outParcT2.textContent = parcTexto[1] || "";

        // Preço PARCELA
        const priceParc = splitPrice(elements.inParcValor.value.trim());
        elements.outParcInt.textContent = priceParc.int;
        elements.outParcDec.textContent = priceParc.dec;

        elements.outTotal.textContent = elements.inTotal.value.trim();

        // RODA AS PROTEÇÕES CONTRA OVERFLOW!
        // 1. Escalona o Título (Base máxima 140px)
        fitText("outTitulo", 140);
        // 2. Escalona o Preço POR (Base máxima 110px)
        fitText("priceBox1", 110);
        // 3. Escalona o Preço Parcela (Base máxima 85px)
        fitText("priceBox2", 85);
      }

      window.onload = function () {
        // Evento nos Inputs Dinheiro
        document.querySelectorAll(".price-input").forEach(input => {
          input.addEventListener("input", handlePriceInput);
        });

        // Eventos gerais pros outros campos
        Object.values(elements).forEach(el => {
          if(el.tagName === "INPUT") {
            el.addEventListener("input", updateOutput);
          }
        });

        // Inicializa pela primeira vez
        updateOutput();

        // Se o usuário redimensionar a janela do PC, reajusta pra não estourar
        window.addEventListener("resize", updateOutput);
      };
    </script>
  </body>
</html>
