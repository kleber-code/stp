<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Volumétrico de Superfície</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        #scanner-container { 
            position: relative; 
            width: 100%; 
            flex-grow: 1;
            background: #000; 
            overflow: hidden; 
        }
        
        /* O vídeo original fica invisível, usamos apenas o Canvas processado */
        video { display: none; }
        
        canvas { 
            position: absolute; 
            top: 0; left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 10; 
        }

        .top-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            z-index: 30;
            display: flex;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        .cam-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-panel { 
            position: absolute; 
            bottom: 0; 
            width: 100%; 
            background: #0f172a;
            border-top: 1px solid #1e293b;
            padding: 24px; 
            box-sizing: border-box; 
            z-index: 20; 
            border-radius: 24px 24px 0 0;
        }

        .input-group { display: flex; gap: 12px; margin-bottom: 20px; }
        
        .input-box {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-box input {
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 900;
            width: 50%;
            outline: none;
        }
        
        .input-box span { font-size: 13px; color: #64748b; font-weight: 700; }

        .main-btn { 
            width: 100%;
            background: #10b981; 
            color: #022c22; 
            border: none; 
            padding: 16px; 
            border-radius: 14px; 
            font-size: 16px;
            font-weight: 900; 
            cursor: pointer; 
            text-transform: uppercase;
        }
        
        #statusText { color: #10b981; font-size: 12px; font-weight: 700; text-transform: uppercase;}
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="scanner-container">
        <div class="top-bar">
            <span id="statusText">Aguardando...</span>
            <button class="cam-btn" id="switchCamBtn">🔄 Trocar Câmera</button>
        </div>
        
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="outputCanvas"></canvas>
        
        <div class="controls-panel">
            <div class="input-group">
                <div class="input-box">
                    <input type="number" id="pesoInput" value="80">
                    <span>KG</span>
                </div>
                <div class="input-box">
                    <input type="number" id="alturaInput" value="175">
                    <span>CM</span>
                </div>
            </div>
            <button class="main-btn" id="startBtn">Ligar Matriz de Escaneamento</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const statusText = document.getElementById('statusText');
        
        let currentStream = null;
        let facingMode = 'environment'; // Começa com a câmera traseira
        let isScanning = false;

        // Motor de Troca de Câmera Nativo
        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } }
                });
                videoElement.srcObject = currentStream;
                
                // Espelha o canvas apenas se for a câmera frontal
                if (facingMode === 'user') {
                    canvasElement.style.transform = "scaleX(-1)";
                } else {
                    canvasElement.style.transform = "scaleX(1)";
                }
                
            } catch (err) {
                alert("Erro ao acessar a câmera. Verifique as permissões.");
            }
        }

        switchCamBtn.addEventListener('click', () => {
            facingMode = (facingMode === 'environment') ? 'user' : 'environment';
            if (isScanning) startCamera();
        });

        // Lógica de Renderização Volumétrica
        function getPressureFactor() {
            const peso = parseFloat(document.getElementById('pesoInput').value) || 80;
            const altura = (parseFloat(document.getElementById('alturaInput').value) || 175) / 100;
            const imc = peso / (altura * altura);
            return Math.min(1.8, Math.max(0.6, imc / 22));
        }

        function drawHeatGradient(ctx, x, y, radius, intensity) {
            const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
            grad.addColorStop(0, `rgba(239, 68, 68, ${intensity})`);     // Vermelho vivo no centro
            grad.addColorStop(0.4, `rgba(245, 158, 11, ${intensity * 0.7})`); // Amarelo
            grad.addColorStop(0.8, `rgba(16, 185, 129, ${intensity * 0.4})`); // Verde
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fillStyle = grad;
            ctx.fill();
        }

        function onResults(results) {
            if (!canvasElement.width) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
                statusText.innerText = "Matriz Ativa";
            }
            
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // 1. Desenha o fundo (Vídeo real escurecido)
            canvasCtx.globalCompositeOperation = 'source-over';
            canvasCtx.globalAlpha = 0.4; // Deixa o ambiente escuro
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // 2. Avalia a Segmentação (Silhueta do Corpo)
            if (results.segmentationMask) {
                canvasCtx.globalAlpha = 1.0;
                
                // Desenha a máscara da silhueta preenchida com um "fundo" de pressão (Azul Frio)
                canvasCtx.drawImage(results.segmentationMask, 0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.globalCompositeOperation = 'source-in'; // Tudo desenhado agora só aparece DENTRO da silhueta
                
                // Preenche o corpo todo com a cor base
                canvasCtx.fillStyle = 'rgba(14, 165, 233, 0.4)'; // Azul base da superfície
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                // 3. Aplica os "pesos" baseados na estrutura interna, mas limitados pela silhueta
                if (results.poseLandmarks) {
                    const lm = results.poseLandmarks;
                    const w = canvasElement.width;
                    const h = canvasElement.height;
                    const pressureFactor = getPressureFactor();

                    // Mapeamento de centros de massa para gerar volume
                    // Em vez de ossos, tratamos essas áreas como "poços de gravidade"
                    const massCenters = [
                        { point: lm[23], radius: 180, p: 1.0 }, // Quadril Esq (Core)
                        { point: lm[24], radius: 180, p: 1.0 }, // Quadril Dir (Core)
                        { point: lm[11], radius: 140, p: 0.8 }, // Omoplata Esq
                        { point: lm[12], radius: 140, p: 0.8 }, // Omoplata Dir
                    ];

                    canvasCtx.globalCompositeOperation = 'screen'; // Mistura as cores térmicas

                    massCenters.forEach(center => {
                        if (center.point && center.point.visibility > 0.5) {
                            const x = center.point.x * w;
                            const y = center.point.y * h;
                            drawHeatGradient(canvasCtx, x, y, center.radius * pressureFactor, center.p * pressureFactor);
                        }
                    });
                }
            }
            
            // Retorna ao estado normal para o próximo frame
            canvasCtx.globalCompositeOperation = 'source-over';
        }

        // Configuração da IA avançada (Com Segmentação de Silhueta Ativada)
        const pose = new Pose({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }});

        pose.setOptions({
            modelComplexity: 1, // Melhor precisão na silhueta
            smoothLandmarks: true,
            enableSegmentation: true, // CRÍTICO: Ativa o recorte real do corpo
            smoothSegmentation: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        pose.onResults(onResults);

        // Loop manual de captura de frames para não depender do utilitário frágil do Google
        async function processVideoFrame() {
            if (videoElement.readyState >= 2) {
                await pose.send({image: videoElement});
            }
            if (isScanning) {
                requestAnimationFrame(processVideoFrame);
            }
        }

        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            startBtn.innerText = "Iniciando Sensores...";
            
            await startCamera();
            isScanning = true;
            
            // Garante que o vídeo está rodando antes de processar
            videoElement.onloadeddata = () => {
                startBtn.style.display = 'none';
                processVideoFrame();
            };
        });
    </script>
</body>
</html>
